<div class="wrapper">
  <div class="add-post">
    <button mat-flat-button (click)="onAddPost()">Add</button>
  </div>

  <table mat-table [dataSource]="dataSource" matSort="matSort">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let post">{{ post.id }}</td>
    </ng-container>
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Naslov</th>
      <td mat-cell *matCellDef="let post">{{ post.title }}</td>
    </ng-container>

    <ng-container matColumnDef="body">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Sadržaj</th>
      <td mat-cell *matCellDef="let post">{{ post.body }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="akcija">Akcija</th>
      <td mat-cell *matCellDef="let post">
        <button mat-raised-button (click)="onEditPost(post.id)">Edit</button>
        <button mat-raised-button (click)="onDeletePost(post.id)">
          Delete
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 100]"
    aria-label="Select page of users"
  ></mat-paginator>
</div>
